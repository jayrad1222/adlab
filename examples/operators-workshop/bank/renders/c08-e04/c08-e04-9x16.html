<!doctype html>
<html data-size="9x16" lang="en">
<head><meta charset="utf-8"><title>offer card</title><style>
/* Shared template styles. The renderer sets --w, --h, brand colors and fonts on :root. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
.art{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--brand-bg);color:var(--brand-text);
  font-family:var(--font-body);display:flex;flex-direction:column;justify-content:space-between;padding:72px 72px}
.hook{font-family:var(--font-head);font-weight:800;font-size:84px;line-height:1.02;letter-spacing:-0.02em;color:var(--brand-primary)}
html[data-size="1x1"] .hook{font-size:76px}
/* 9:16 keeps text out of the platform overlays: top 270, right 140, bottom 650 (library/platform/specs-and-safe-zones.md) */
html[data-size="9x16"] .art{padding:270px 140px 650px 72px}
.kicker{font-family:var(--font-head);font-weight:700;font-size:38px;line-height:1.15;color:var(--brand-text);opacity:.85;margin-bottom:28px;text-transform:uppercase;letter-spacing:.04em}
.offer{font-family:var(--font-body);font-weight:600;font-size:40px;line-height:1.2;color:var(--brand-text)}
.wordmark{font-family:var(--font-head);font-weight:800;font-size:40px;letter-spacing:-0.01em;color:var(--brand-primary)}
.bar{height:14px;width:220px;background:var(--brand-accent);border-radius:7px;margin:36px 0}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.12) 45%,rgba(0,0,0,.6) 100%)}
.on-photo{background:var(--brand-primary)}
.photo[src=""]{display:none}
.over{position:relative;z-index:2}
.on-photo .hook,.on-photo .offer,.on-photo .wordmark,.on-photo .kicker{color:#fff}
.footer{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.list{display:flex;flex-direction:column;gap:26px;margin-top:44px}
.list .row{display:flex;gap:28px;align-items:flex-start;font-size:44px;line-height:1.25;font-weight:600}
.list .n{font-family:var(--font-head);font-weight:800;color:var(--brand-primary);min-width:70px}
.quote{font-family:var(--font-head);font-weight:600;font-size:60px;line-height:1.15;color:var(--brand-text)}
.attrib{font-size:36px;opacity:.8;margin-top:28px}
.note{font-family:var(--font-body);font-size:46px;line-height:1.35;color:var(--brand-text);white-space:pre-line}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.vs .col{padding:40px;border-radius:24px;font-size:40px;line-height:1.3}
.vs .them{background:rgba(0,0,0,.06)}
.vs .us{background:var(--brand-accent)}
.vs h3{font-family:var(--font-head);font-size:44px;margin-bottom:22px}
.ugly{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:70px;line-height:1.1;color:#111;background:#fff;padding:60px}

</style>
<style>.art{background:var(--brand-primary);color:#fff}.art .hook,.art .offer,.art .wordmark,.art .kicker{color:#fff}.price{font-family:var(--font-head);font-weight:800;font-size:150px;line-height:1;margin:40px 0 10px}.per{font-size:40px;opacity:.85}.terms{font-size:36px;opacity:.85;margin-top:30px;line-height:1.3}</style>
<style>:root{--w:1080px;--h:1920px;--brand-primary:#17321f;--brand-accent:#b7e4c7;--brand-bg:#ffffff;--brand-text:#111111;--font-head:Inter Tight, Inter, Helvetica Neue, Arial, sans-serif;--font-body:Inter, Helvetica Neue, Arial, sans-serif;}</style></head>
<body><div class="art">
  <div>
    <div class="kicker" data-optional="kicker">For the AI chat tab that never became a system. Operators Workshop, from founders who run businesses.</div>
    <div class="hook">$97 a month after 7 days free. No crossed-out number above it.</div>
    <div class="price">$97</div>
    <div class="per" data-optional="per">a month</div>
    <div class="terms" data-optional="terms">7 days free. Cancel anytime.</div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">Our builds as they happen: the prompts, systems, wins and mistakes behind the work.</div><div class="wordmark">OW.</div></div>
</div></body>
</html>
