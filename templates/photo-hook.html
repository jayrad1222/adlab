<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>photo hook</title><link rel="stylesheet" href="_base.css">
<style>.art{padding:72px}.hook{font-size:80px}</style>
</head>
<body><div class="art on-photo">
  <img class="photo" src="{{photo_image}}" alt="">
  <div class="scrim"></div>
  <div class="over"><div class="kicker" data-optional="kicker">{{kicker}}</div><div class="hook">{{hook}}</div></div>
  <div class="over footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
