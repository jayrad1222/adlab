<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>carousel card</title><link rel="stylesheet" href="_base.css">
<style>.step{font-family:var(--font-head);font-weight:800;font-size:160px;line-height:1;color:var(--brand-accent);margin-bottom:20px}.hook{font-size:66px}.body{font-size:42px;line-height:1.35;margin-top:30px}</style>
</head>
<body><div class="art">
  <div>
    <div class="step" data-optional="step">{{step}}</div>
    <div class="hook">{{hook}}</div>
    <div class="body" data-optional="body">{{body}}</div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
