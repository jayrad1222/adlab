<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>founder note</title><link rel="stylesheet" href="_base.css">
<style>.art{background:var(--brand-bg)}.note{font-family:Georgia,"Times New Roman",serif;font-size:44px;line-height:1.4}.sig{font-family:Georgia,serif;font-size:40px;margin-top:40px}.hook{font-size:62px;margin-bottom:34px}html[data-size="1x1"] .note{font-size:40px}</style>
</head>
<body><div class="art">
  <div>
    <div class="hook">{{hook}}</div>
    <div class="note">{{body}}</div>
    <div class="sig" data-optional="signature">{{signature}}</div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
