<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>three reasons</title><link rel="stylesheet" href="_base.css">
<style>.hook{font-size:70px}html[data-size="1x1"] .hook{font-size:62px}.list .row{font-size:42px}</style>
</head>
<body><div class="art">
  <div>
    <div class="kicker" data-optional="kicker">{{kicker}}</div>
    <div class="hook">{{hook}}</div>
    <div class="list">
      <div class="row"><span class="n">1</span><span>{{reason_1}}</span></div>
      <div class="row"><span class="n">2</span><span>{{reason_2}}</span></div>
      <div class="row"><span class="n">3</span><span>{{reason_3}}</span></div>
    </div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
