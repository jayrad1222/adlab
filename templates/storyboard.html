<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>storyboard</title><link rel="stylesheet" href="_base.css">
<style>.art{background:#fff;padding:60px;justify-content:flex-start;gap:30px}.title{font-family:var(--font-head);font-weight:800;font-size:44px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.f{border:2px solid #ddd;border-radius:10px;padding:22px;min-height:230px}.f h4{font-family:var(--font-head);font-size:32px;margin-bottom:10px;color:var(--brand-primary)}.f .ost{font-size:34px;font-weight:700;line-height:1.2}.f .vis{font-size:32px;line-height:1.3;color:#444;margin-top:8px}html[data-size="9x16"] .grid{grid-template-columns:1fr}html[data-size="9x16"] .f{min-height:200px}</style>
</head>
<body><div class="art">
  <div class="title">{{title}}</div>
  <div class="grid">
    <div class="f"><h4>1 · Hook (0-3s)</h4><div class="ost">{{f1_text}}</div><div class="vis">{{f1_visual}}</div></div>
    <div class="f"><h4>2 · Beat</h4><div class="ost">{{f2_text}}</div><div class="vis">{{f2_visual}}</div></div>
    <div class="f"><h4>3 · Beat</h4><div class="ost">{{f3_text}}</div><div class="vis">{{f3_visual}}</div></div>
    <div class="f"><h4>4 · Beat</h4><div class="ost">{{f4_text}}</div><div class="vis">{{f4_visual}}</div></div>
    <div class="f"><h4>5 · Proof</h4><div class="ost">{{f5_text}}</div><div class="vis">{{f5_visual}}</div></div>
    <div class="f"><h4>6 · CTA</h4><div class="ost">{{f6_text}}</div><div class="vis">{{f6_visual}}</div></div>
  </div>
</div></body>
</html>
