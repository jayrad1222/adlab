<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>us vs them</title><link rel="stylesheet" href="_base.css">
<style>.vs .col div{margin-bottom:18px}.hook{font-size:68px}html[data-size="1x1"] .hook{font-size:60px}</style>
</head>
<body><div class="art">
  <div>
    <div class="kicker" data-optional="kicker">{{kicker}}</div>
    <div class="hook">{{hook}}</div>
    <div class="vs">
      <div class="col them"><h3>{{them_label}}</h3><div>{{them_1}}</div><div>{{them_2}}</div><div data-optional="them_3">{{them_3}}</div></div>
      <div class="col us"><h3>{{us_label}}</h3><div>{{us_1}}</div><div>{{us_2}}</div><div data-optional="us_3">{{us_3}}</div></div>
    </div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
