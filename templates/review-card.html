<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>review card</title><link rel="stylesheet" href="_base.css">
<style>.quote:before{content:"\201C";opacity:.5}.quote:after{content:"\201D";opacity:.5}.consent{font-size:32px;opacity:.6;margin-top:18px}</style>
</head>
<body><div class="art">
  <div>
    <div class="kicker" data-optional="kicker">{{kicker}}</div>
    <div class="quote">{{quote}}</div>
    <div class="attrib">{{attribution}}</div>
    <div class="consent" data-optional="consent_line">{{consent_line}}</div>
  </div>
  <div class="footer"><div class="offer" data-optional="offer_line">{{offer_line}}</div><div class="wordmark">{{wordmark}}</div></div>
</div></body>
</html>
